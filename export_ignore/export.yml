export_root: "res://addons/package_exporter/export_ignore/exports/"
build_require: @require
# The fixture plugin export_fixture_test exports five ways; test-only, so it never ships.
test_require:
  - "@require"
  - "brohd11/godot-plugin-exporter-test-plugin@v0.2.1"
exports:
  -
    exclude:
      directories:
        - "res://addons/package_exporter/export_ignore"
      file_extensions: []
      files: []
    remote_dir: "res://addons/package_exporter/src/remote/"
    export_name: "package-exporter{{version=package_exporter}}"
    export_folder: "addons/package_exporter"
    other_transfers: []
    source: "res://addons/package_exporter/"
    parser_overide_settings:
      parse_cs: {}
      parse_gd: {}
      parse_tscn: {}
      parse_tres: {}
options:
  include_import: true
  include_uid: true
  overwrite: true
  parser_settings:
    use_relative_paths: false
    replace_editor_interface: false
    parse_cs: {}
    parse_gd:
      class_rename_ignore: []
      backport_string_renames: {}
    parse_tscn: {}
    parse_tres: {}
plugin_folder: "PackageExporter/PackageExporter{{version=package_exporter}}"
post_script: ""
pre_script: ""
